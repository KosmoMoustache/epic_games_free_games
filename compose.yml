services:
  epic-games-free-games:
    image: ghcr.io/kosmomoustache/epic_games_free_games:latest
    container_name: epic-games-free-games
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      EGFG_SCHEDULE: "0 17 * * *"
      EGFG_RUN_ON_START: "true"
      WEBHOOK_URL: https://discord.com/api/webhooks/CHANGE_ME
      LOCALES: en-GB
    volumes:
      - db:/app/db
      - logs:/app/logs

volumes:
  db:
  logs:
