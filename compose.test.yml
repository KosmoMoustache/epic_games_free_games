services:
  epic-games-free-games:
    build: ./
    image: epic_games_free_games:test
    container_name: epic-games-free-games-test
    restart: "no"
    environment:
      EGFG_SCHEDULE: "* * * * *"
      EGFG_RUN_ON_START: "true"
      WEBHOOK_URL: https://discord.com/api/webhooks/CHANGE_ME
      LOG_LEVEL: debug
      USE_CACHE: true
      LOCALES: en-GB
    volumes:
      - ./test/providers/epic/epic_1.json:/app/epicLocalData.json
      - ./test/providers/steam/steam_1.json:/app/steamLocalData.json
    tmpfs:
      - /app/db:rw,mode=1777
      - /app/logs:rw,mode=1777
