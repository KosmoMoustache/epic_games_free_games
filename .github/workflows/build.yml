name: Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Custom version (defaults to package.json)"
        required: false
        type: string

  workflow_call:
    inputs:
      version:
        description: "Docker image version"
        required: false
        type: string
        default: ""
      release_tags:
        description: "Publish major, minor and latest tags"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$(jq -r '.version' package.json)}"
          VERSION="${VERSION#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
          RELEASE_TAGS: ${{ inputs.release_tags }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION"

            if [[ "$RELEASE_TAGS" == "true" ]]; then
              echo "$IMAGE:${VERSION%%.*}"
              echo "$IMAGE:${VERSION%.*}"
              echo "$IMAGE:latest"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
